[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolsim"
version = "0.1.0"
description = "Classroom airborne-transmission simulator (Wells-Riley + SEIR) for school scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime deps live in requirements.txt (pinned) so Streamlit Cloud and judges get the same versions.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/schoolsim/seir.py" = ["E741"]
