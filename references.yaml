epa_2011:
  author: U.S. Environmental Protection Agency
  year: 2011
  short: U.S. EPA (2011)
  aliases: [U.S. EPA]
  apa: >-
    U.S. Environmental Protection Agency. (2011). Chapter 6: Inhalation rates. In *Exposure factors
    handbook: 2011 edition* (EPA/600/R-09/052F). https://www.epa.gov/expobox/exposure-factors-handbook-chapter-6
  url: https://www.epa.gov/expobox/exposure-factors-handbook-chapter-6
  status: verified
  verified_on: 2026-10-21
  checked_via: EPA HERO record 11414382 and the EPA Exposure Factors Handbook page
  notes: >-
    Long-term mean inhalation rate for ages 6 to under 11 is 12 m³/day (about 0.5 m³/h), as quoted in EPA's own
    RSEI technical appendix. Azimi et al. (2020) interpolate 12.96 m³/day for primary and 15.53 m³/day for secondary students.
    Short-term "sedentary" rates are in the chapter tables; read them to tighten the in-class range.

