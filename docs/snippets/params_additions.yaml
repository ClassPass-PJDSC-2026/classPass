# OPTIONAL: append these two blocks to the end of params.yaml (seat map settings, ticket #26).
# If you add them, also add the three pieces in assumptions_additions.md, or tests/test_params.py will fail.
# If you add neither, the seat map falls back to the same defaults built into the app.

# --- Seat map (heuristic, ticket #26) -------------------------------------------

near_field_multiplier:
  value: 3.0
  min: 0.0
  max: 10.0
  unit: factor
  description: Extra infection risk right next to an infected student, as a multiple of the well-mixed risk (seat map only)
  source: [team_assumption]
  confidence: low
  in_sensitivity: false
  user_editable: true

near_field_decay_m:
  value: 1.5
  min: 0.5
  max: 3.0
  unit: m
  description: Distance over which the near-field extra risk fades (seat map only)
  source: [team_assumption]
  confidence: low
  in_sensitivity: false
  user_editable: true
