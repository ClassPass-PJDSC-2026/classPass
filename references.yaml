  doi: 10.1111/ina.12701
  status: verified
  verified_on: 2026-10-21
  checked_via: PubMed Central PMC7687273 and White Rose eprint 161708
  notes: Reports q = 0.11 quanta per hour (95% CI 0.088–0.12) for influenza in a challenge trial. Used to document disagreement between sources.

