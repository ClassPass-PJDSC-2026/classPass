# Reference list: single source of truth for every citation in the app, docs, README and proposal.
# Edit here, then run `python scripts/build_references.py` to refresh docs/references_apa7.md,
# docs/references_apa7.html and the reference block in docs/proposal_text.md.
#
# Fields per entry
#   author       in-text author text, exactly as APA 7th writes it in a citation ("Carrat et al.")
#   year         publication year (integer) or null for statutes and undated items
#   short        label used in app tooltips, e.g. "Carrat et al. (2008)"
#   aliases      other in-text author strings accepted by the citation checker (abbreviations)
#   apa          the full reference in APA 7th. *asterisks* mark italics
#   doi / url    for convenience; they also appear inside `apa`
#   status       verified = title, authors, year and venue checked against a publisher, library or
#                           government record; partial = something specific is still unchecked (see notes)
#   verified_on  date of the check
#   checked_via  where it was checked
#   notes        what is still open, or what the source is used for
#
# Reserved source keys that need no entry here: team_assumption, team_decision.

wells_1955:
  author: Wells
  year: 1955
  short: Wells (1955)
  aliases: []
  apa: >-
    Wells, W. F. (1955). *Airborne contagion and air hygiene: An ecological study of droplet
    infections*. Harvard University Press.
  url: https://content.wellcomecollection.org/works/vpa396bu
  status: verified
  verified_on: 2026-10-21
  checked_via: Wellcome Collection and National Library of Ireland catalogue records
  notes: Foundational source for the Wells-Riley idea. Published for the Commonwealth Fund by Harvard University Press.

riley_1978:
  author: Riley et al.
  year: 1978
  short: Riley et al. (1978)
  aliases: []
  apa: >-
    Riley, E. C., Murphy, G., & Riley, R. L. (1978). Airborne spread of measles in a suburban
    elementary school. *American Journal of Epidemiology, 107*(5), 421–432.
    https://doi.org/10.1093/oxfordjournals.aje.a112560
  doi: 10.1093/oxfordjournals.aje.a112560
  status: verified
  verified_on: 2026-10-21
  checked_via: PubMed 665658 and the Oxford Academic record
  notes: School outbreak used to derive the quanta idea. Reports about 93 quanta per minute for the measles index case.

rudnick_milton_2003:
  author: Rudnick & Milton
  year: 2003
  short: Rudnick & Milton (2003)
  aliases: []
  apa: >-
    Rudnick, S. N., & Milton, D. K. (2003). Risk of indoor airborne infection transmission
    estimated from carbon dioxide concentration. *Indoor Air, 13*(3), 237–245.
    https://doi.org/10.1034/j.1600-0668.2003.00189.x
  doi: 10.1034/j.1600-0668.2003.00189.x
  status: verified
  verified_on: 2026-10-21
  checked_via: CDC Stacks record (journal, volume, pages); DOI from the reference list of Azimi and Stephens (2013)
  notes: >-
    The 15–128 quanta per hour range for influenza was read in Azimi and Stephens (2013), which describes
    it as based on a grounded airliner outbreak. Read the paper's own table before final submission.

azimi_stephens_2013:
  author: Azimi & Stephens
  year: 2013
  short: Azimi & Stephens (2013)
  aliases: []
  apa: >-
    Azimi, P., & Stephens, B. (2013). HVAC filtration for controlling infectious airborne disease
    transmission in indoor environments: Predicting risk reductions and operational costs.
    *Building and Environment, 70*, 150–160. https://doi.org/10.1016/j.buildenv.2013.08.025
  doi: 10.1016/j.buildenv.2013.08.025
  status: verified
  verified_on: 2026-10-21
  checked_via: PubMed Central PMC7127325 (full text read)
  notes: >-
    Tabulates quanta generation rates by disease (influenza about 15–500 per hour) and describes the
    Rudnick and Milton estimate. Replaces the entry that was filed in error as
    "wr_size_dependent_review" (that was a section heading of this paper, not a title).

azimi_2020:
  author: Azimi et al.
  year: 2020
  short: Azimi et al. (2020)
  aliases: []
  apa: >-
    Azimi, P., Keshavarz, Z., Cedeno Laurent, J. G., & Allen, J. G. (2020). Estimating the nationwide
    transmission risk of measles in US schools and impacts of vaccination and supplemental infection
    control strategies. *BMC Infectious Diseases, 20*, Article 497.
    https://doi.org/10.1186/s12879-020-05200-6
  doi: 10.1186/s12879-020-05200-6
  status: verified
  verified_on: 2026-10-21
  checked_via: PubMed Central PMC7351650 (full text read) and the correction notice PMC7379758 (author name)
  notes: >-
    Recent Wells-Riley application to schools. Reports that combining advanced filtration, ventilation and air
    purification could cut the average number of infected students by about half in the modelled US schools.

bueno_de_mesquita_2020:
  author: Bueno de Mesquita et al.
  year: 2020
  short: Bueno de Mesquita et al. (2020)
  aliases: []
  apa: >-
    Bueno de Mesquita, P. J., Noakes, C. J., & Milton, D. K. (2020). Quantitative aerobiologic analysis of
    an influenza human challenge-transmission trial. *Indoor Air, 30*(6), 1189–1198.
